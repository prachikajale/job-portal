{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Login | Campus Placement</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
body{
  height:100vh; display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}
.card{
  background:white; width:400px; padding:40px 35px; border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.3); text-align:center;
}
.logo{ font-size:45px; margin-bottom:10px; }
.card h1{ font-size:28px; color:#2d3748; margin-bottom:5px; }
.card p{ color:#718096; font-size:14px; margin-bottom:25px; }
label{ display:block; text-align:left; font-weight:600; font-size:14px; color:#4a5568; margin:12px 0 5px; }
input{
  width:100%; padding:13px 15px; border:2px solid #e2e8f0; border-radius:10px;
  font-size:15px; outline:none; transition:0.3s;
}
input:focus{ border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,0.15); }
button{
  width:100%; margin-top:22px; padding:14px; border:none; border-radius:10px;
  background: linear-gradient(135deg, #667eea, #764ba2); color:white;
  font-size:16px; font-weight:700; cursor:pointer; transition:0.3s;
}
button:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(102,126,234,0.4); }
.link{ margin-top:18px; font-size:14px; color:#718096; }
.link a{ color:#667eea; font-weight:700; text-decoration:none; }
.badge{ display:inline-block; background:#ebf4ff; color:#667eea; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:700; margin-top:15px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎓</div>
  <h1>Welcome Back!</h1>
  <p>Campus Placement Portal</p>
  <form method="POST">
    {% csrf_token %}
    {% if messages %}
      {% for message in messages %}
        <p style="background:#ffe0e0; color:#c53030; padding:10px; border-radius:8px; font-size:14px; font-weight:600;">{{ message }}</p>
      {% endfor %}
    {% endif %}
    {% if form.errors %}
      <p style="background:#ffe0e0; color:#c53030; padding:10px; border-radius:8px; font-size:14px; font-weight:600;">Invalid Username or Password! Try again.</p>
    {% endif %}
    <label>Username</label>
    <input type="text" name="username" placeholder="e.g. tcs_company" required>
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter your password" required>
    <button type="submit">Login →</button>
  </form>
  <div class="link">No account? <a href="{% url 'register' %}">Register</a></div>
</div>
</body>
</html>
