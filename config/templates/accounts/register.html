{% extends 'base.html' %}
{% block content %}
<div style="max-width:400px; margin:50px auto; padding:30px; background:white; border-radius:10px; box-shadow:0 0 10px #ddd;">
<h2 style="text-align:center;">Create Account</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="width:100%; padding:10px; background:#2563eb; color:white; border:none; border-radius:5px;">Register</button>
</form>
<p style="text-align:center; margin-top:15px;">Already have account? <a href="/accounts/login/">Login</a></p>
</div>
{% endblock %}
