<!DOCTYPE html>
<html>
<head>

        nav a { color:white; text-decoration:none; margin-left:20px; font-weight:bold; }

            <a href="/accounts/register/">Register</a>

    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
